name: XiYingChain
version: '1.0.0'
main: com.xiying.chain.ChainPlugin
api-version: '1.20'
author: 'XiYing'
description: '连锁挖矿 - 移植自基岩版 chain 插件，支持 Java/基岩玩家'
folia-supported: true

commands:
  chain:
    description: 连锁挖矿设置
    aliases: [ch]
    usage: /chain [on|off|sneak|block <ID>|reload]
    permission: chain.use

permissions:
  chain.use:
    description: 使用连锁挖矿及 /chain 设置
    default: true
  chain.admin:
    description: 使用 /chain reload 重载配置
    default: op
